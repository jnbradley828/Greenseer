[package]
name = "Greenseer"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7.8"
oxi_chess_lib = { git = "https://github.com/jnbradley828/oxi_chess_lib" }
serde = { version = "1.0.229", features = ["derive"] }
serde-big-array = "0.5.1"
toml = "1.1.6"

[build-dependencies]
toml = "1.1.6"

[features]
tuning = []

[[bin]]
name = "texel"
path = "src/bin/texel.rs"
required-features = ["tuning"]
